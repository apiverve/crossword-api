[project]
name = "apiverve-crosswordgenerator"
version = "1.2.3"
authors = [
  { name="APIVerve", email="hello@apiverve.com" },
]
description = "Crossword Generator is a crossword puzzle API that creates crosswords with intersecting words, numbered clues, and themed word selection."
keywords = ["crossword api", "crossword puzzle api", "crossword generator api", "crossword puzzle generator", "printable crossword"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.25.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://apiverve.com/marketplace/crossword?utm_source=pypi&utm_medium=referral&utm_content=homepage"
Documentation = "https://docs.apiverve.com/ref/crossword?utm_source=pypi&utm_medium=referral&utm_content=docs"
Repository = "https://github.com/apiverve/crossword-api"
Twitter = "https://twitter.com/apivervehq"
